<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>FCMA — Your browser. Your tools. Your workspace.</title>
<meta name="description" content="FCMA: 40+ powerful browser tools, CV Studio, Document Lab, AI Lab, Tool Builder — privacy-first, works offline."/>
<meta name="theme-color" content="#0b0d10"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%225%22 fill=%22%23ff6a2b%22/><path d=%22M6 6h12M6 12h9M6 18h6%22 stroke=%22%230b0d10%22 stroke-width=%222.5%22 stroke-linecap=%22round%22/></svg>"/>
<meta property="og:title" content="FCMA — Powerful tools. Private by default."/>
<meta property="og:description" content="Everything you need. Right in your browser. 40+ tools, CV Studio, AI Lab, Tool Builder."/>
<meta property="og:type" content="website"/>
<style>
/* ============================================================
   FCMA — Design system
   ============================================================ */
:root{
  --bg:#0a0b0d; --bg-1:#0f1114; --bg-2:#14171c; --bg-3:#1a1e25;
  --line:rgba(255,255,255,0.08); --line-2:rgba(255,255,255,0.14);
  --text:#e8eaed; --text-2:#b8bcc4; --muted:#7d838f; --muted-2:#5b6169;
  --accent:#ff6a2b; --accent-2:#ff8a4d; --accent-glow:rgba(255,106,43,.15);
  --ok:#4ade80; --warn:#fbbf24; --err:#f87171; --info:#60a5fa; --ai:#a78bfa;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --radius:10px; --radius-lg:14px; --radius-xl:20px;
  --shadow:0 4px 12px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.5);
  --shadow-lg:0 20px 60px rgba(0,0,0,.6), 0 8px 24px rgba(0,0,0,.4);
  --header-h:56px; --sidebar-w:240px;
}
[data-theme=light]{
  --bg:#fafafa; --bg-1:#ffffff; --bg-2:#f4f5f7; --bg-3:#eceef1;
  --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.14);
  --text:#0a0b0d; --text-2:#40454e; --muted:#6b7280; --muted-2:#8b93a1;
  --shadow:0 4px 12px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.08);
  --shadow-lg:0 20px 60px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.08);
}
*,*:before,*:after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:9px 12px;outline:none;transition:border .15s,background .15s;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:var(--bg-1)}
textarea{resize:vertical;font-family:var(--mono);font-size:13px;line-height:1.55;min-height:140px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:10px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--muted-2)}
::selection{background:var(--accent);color:#000}
code,pre{font-family:var(--mono);font-size:13px}

/* Header */
.header{position:sticky;top:0;z-index:50;height:var(--header-h);background:rgba(10,11,13,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:14px}
[data-theme=light] .header{background:rgba(255,255,255,.85)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand-logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#e6501b);display:grid;place-items:center;color:#0b0d10;font-weight:900;font-size:13px}
.header nav{display:flex;gap:2px;margin-left:8px}
.header nav a{padding:7px 12px;border-radius:8px;color:var(--text-2);font-weight:500;font-size:13.5px;transition:.15s}
.header nav a:hover{background:var(--bg-2);color:var(--text)}
.header nav a.active{background:var(--bg-2);color:var(--text)}
.header-spacer{flex:1}
.search-trigger{display:flex;align-items:center;gap:8px;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--muted);font-size:13px;min-width:220px;cursor:pointer;transition:.15s}
.search-trigger:hover{border-color:var(--line-2)}
.search-trigger kbd{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--bg-3);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--text-2)}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--text-2);transition:.15s}
.icon-btn:hover{background:var(--bg-2);color:var(--text)}
.mobile-toggle{display:none}
@media(max-width:820px){
  .header nav{display:none}
  .search-trigger{min-width:0;padding:6px 10px}
  .search-trigger span{display:none}
  .mobile-toggle{display:grid}
}

/* Layout */
main{min-height:calc(100vh - var(--header-h))}
.container{max-width:1280px;margin:0 auto;padding:32px 24px}
.container-sm{max-width:960px;margin:0 auto;padding:32px 24px}
h1{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0}
h2{font-size:26px;font-weight:700;letter-spacing:-.015em;margin:0}
h3{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0}
h4{font-size:14px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:0}
.muted{color:var(--muted)}
.text-2{color:var(--text-2)}
.text-accent{color:var(--accent)}
.mono{font-family:var(--mono)}

/* Landing hero */
.hero{padding:80px 24px 60px;text-align:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;top:-200px;left:50%;transform:translateX(-50%);width:900px;height:600px;background:radial-gradient(ellipse at center,var(--accent-glow),transparent 70%);pointer-events:none}
.hero .eyebrow{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:var(--bg-2);border:1px solid var(--line);border-radius:99px;font-size:12px;color:var(--text-2);position:relative;z-index:1}
.hero .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.hero h1{margin-top:24px;font-size:clamp(38px,6vw,68px);position:relative}
.hero .tagline{font-size:clamp(16px,2vw,20px);color:var(--text-2);margin-top:20px;max-width:640px;margin-left:auto;margin-right:auto;position:relative}
.hero-search{max-width:600px;margin:36px auto 0;position:relative;z-index:1}
.hero-search input{padding:16px 20px;font-size:16px;border-radius:12px;background:var(--bg-1);border:1px solid var(--line-2);text-align:center}
.hero-search-hint{font-size:12px;color:var(--muted);margin-top:10px}
.hero-cta{margin-top:32px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;position:relative;z-index:1}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:9px;font-weight:600;font-size:14px;transition:.15s;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.btn-primary{background:var(--accent);color:#0b0d10}
.btn-primary:hover{background:var(--accent-2)}
.btn-ghost{background:var(--bg-2);border-color:var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--line-2);background:var(--bg-3)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-lg{padding:12px 22px;font-size:15px}
.btn-danger{background:transparent;color:var(--err);border-color:rgba(248,113,113,.3)}
.btn-danger:hover{background:rgba(248,113,113,.1)}

/* Category strip */
.cat-strip{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:44px;position:relative;z-index:1}
.cat-chip{padding:7px 14px;background:var(--bg-2);border:1px solid var(--line);border-radius:99px;color:var(--text-2);font-size:13px;transition:.15s}
.cat-chip:hover{border-color:var(--accent);color:var(--text)}
.cat-chip .count{color:var(--muted);margin-left:6px;font-size:11px}

/* Sections */
.section{padding:60px 24px}
.section-head{max-width:1280px;margin:0 auto 32px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px}
.grid{display:grid;gap:14px;max-width:1280px;margin:0 auto}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:960px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}}

/* Tool card */
.tool-card{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;transition:.2s;display:flex;flex-direction:column;gap:8px;position:relative;cursor:pointer;text-decoration:none;color:inherit}
.tool-card:hover{border-color:var(--line-2);transform:translateY(-2px);background:var(--bg-2)}
.tool-card .row{display:flex;align-items:center;gap:10px}
.tool-card .icon{width:36px;height:36px;border-radius:9px;background:var(--bg-3);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.tool-card h3{font-size:15px;flex:1}
.tool-card p{color:var(--muted);font-size:13px;margin-top:2px;line-height:1.5}
.tool-card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px}
.privacy-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:99px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.privacy-local{background:rgba(74,222,128,.12);color:#4ade80}
.privacy-remote{background:rgba(251,191,36,.12);color:#fbbf24}
.privacy-ai{background:rgba(167,139,250,.15);color:#a78bfa}
.fav-btn{color:var(--muted-2);padding:4px;border-radius:6px;transition:.15s;font-size:14px;line-height:1}
.fav-btn:hover{color:var(--accent);background:var(--bg-3)}
.fav-btn.on{color:var(--accent)}

/* Sidebar layout for tools */
.tool-page{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:calc(100vh - var(--header-h))}
.tool-sidebar{border-right:1px solid var(--line);background:var(--bg-1);padding:16px;position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));overflow-y:auto}
.tool-sidebar h4{margin:14px 0 8px;padding:0 6px}
.tool-sidebar h4:first-child{margin-top:0}
.side-link{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--text-2);font-size:13px;transition:.15s;cursor:pointer}
.side-link:hover{background:var(--bg-2);color:var(--text)}
.side-link.active{background:var(--accent-glow);color:var(--accent);font-weight:600}
.side-link .ic{font-size:14px;width:16px;text-align:center}
.tool-content{padding:24px;max-width:1200px;width:100%}
@media(max-width:900px){
  .tool-page{grid-template-columns:1fr}
  .tool-sidebar{position:relative;top:0;height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:10px}
  .tool-sidebar h4{display:none}
  .side-link{flex-shrink:0;padding:6px 12px}
}

/* Tool UI helpers */
.tool-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.tool-header h1{font-size:26px;font-weight:700}
.tool-header p{color:var(--muted);margin-top:4px;font-size:13.5px}
.tool-actions{display:flex;gap:8px;flex-wrap:wrap}
.tool-body{display:grid;gap:16px}
.tool-split{grid-template-columns:1fr 1fr}
@media(max-width:800px){.tool-split{grid-template-columns:1fr}}
.field{display:grid;gap:6px}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.field .row{display:flex;gap:8px;align-items:center}
.card{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px}
.card h3{margin-bottom:12px}
.note{padding:10px 12px;background:var(--bg-2);border-left:3px solid var(--info);border-radius:6px;font-size:13px;color:var(--text-2)}
.note.warn{border-color:var(--warn)}
.note.err{border-color:var(--err)}
.note.ok{border-color:var(--ok)}
.checkbox{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:13px}
.checkbox input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.select-inline{display:inline-block;width:auto;padding:6px 28px 6px 10px;font-size:13px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;transition:.15s}
.tab.active{color:var(--text);border-color:var(--accent)}
.tab:hover{color:var(--text)}
.kbd{font-family:var(--mono);font-size:11px;background:var(--bg-3);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--text-2)}

/* Command Palette */
.cp-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.cp-backdrop.on{display:flex}
.cp{background:var(--bg-1);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-lg);width:min(600px,92vw);max-height:70vh;display:flex;flex-direction:column;overflow:hidden}
.cp input{padding:14px 18px;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;font-size:15px}
.cp-results{flex:1;overflow-y:auto;padding:6px}
.cp-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;cursor:pointer;transition:.1s}
.cp-item .icon{width:28px;height:28px;border-radius:7px;background:var(--bg-3);display:grid;place-items:center;font-size:14px;flex-shrink:0}
.cp-item .info{flex:1;min-width:0}
.cp-item .name{font-size:14px;color:var(--text);font-weight:500}
.cp-item .desc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-item .cat{font-size:11px;color:var(--muted-2)}
.cp-item.sel,.cp-item:hover{background:var(--bg-2)}
.cp-empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}
.cp-foot{padding:8px 14px;border-top:1px solid var(--line);display:flex;gap:14px;font-size:11px;color:var(--muted-2)}

/* Toast */
.toast-host{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:10px 16px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);font-size:13px;color:var(--text);animation:tin .25s;pointer-events:auto}
.toast.ok{border-left:3px solid var(--ok)}
.toast.err{border-left:3px solid var(--err)}
.toast.warn{border-left:3px solid var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* CV Studio specific */
.cv-editor{display:grid;grid-template-columns:380px 1fr;gap:0;height:calc(100vh - var(--header-h))}
.cv-panel{overflow-y:auto;padding:20px;border-right:1px solid var(--line);background:var(--bg-1)}
.cv-preview{overflow-y:auto;background:var(--bg-2);padding:24px;display:flex;justify-content:center}
.cv-paper{background:#fff;color:#111;width:100%;max-width:820px;min-height:1160px;padding:48px 56px;font-family:var(--font);border-radius:6px;box-shadow:0 4px 30px rgba(0,0,0,.4)}
@media(max-width:900px){.cv-editor{grid-template-columns:1fr;height:auto}.cv-preview{padding:14px}.cv-paper{padding:28px 22px;min-height:auto}}
.cv-section{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.cv-section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;cursor:pointer}
.cv-section-head h4{color:var(--text);text-transform:none;font-size:13.5px}
.cv-section-body{display:grid;gap:8px}
.cv-item{background:var(--bg-1);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;position:relative}
.cv-item .del{position:absolute;top:6px;right:6px;color:var(--muted);padding:4px;border-radius:4px}
.cv-item .del:hover{color:var(--err);background:var(--bg-3)}
.cv-list-file{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.cv-file-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px}
.cv-file-item:hover{background:var(--bg-2)}
.cv-file-item.active{background:var(--accent-glow);border-color:var(--accent)}
.cv-file-item .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-file-item .m{font-size:11px;color:var(--muted)}

/* CV templates baseline */
.cv-classic h1{font-size:30px;font-weight:700;color:#111}
.cv-classic h2{font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:#333;border-bottom:2px solid #111;padding-bottom:4px;margin-top:20px;margin-bottom:12px}
.cv-classic .job-title{color:#555;font-size:16px;margin-top:4px}
.cv-classic .contact{color:#555;font-size:13px;display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.cv-classic .entry{margin-bottom:14px}
.cv-classic .entry .h{display:flex;justify-content:space-between;font-weight:600;color:#111;font-size:14px}
.cv-classic .entry .sub{font-size:13px;color:#555;font-style:italic}
.cv-classic .entry .desc{font-size:13.5px;color:#222;margin-top:4px;white-space:pre-wrap}
.cv-classic .skills{display:flex;flex-wrap:wrap;gap:6px}
.cv-classic .skills span{background:#f0f0f0;padding:3px 10px;border-radius:99px;font-size:12px}

.cv-modern{display:grid;grid-template-columns:1fr 2fr;gap:26px}
.cv-modern .left{background:#0b0d10;color:#fff;margin:-48px 0 -48px -56px;padding:48px 24px}
.cv-modern .left h1{font-size:24px;color:#fff;line-height:1.2}
.cv-modern .left .job-title{color:#ff8a4d;font-size:14px;margin-top:4px}
.cv-modern .left h2{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#ff8a4d;margin:22px 0 8px}
.cv-modern .left .contact{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:#e8eaed}
.cv-modern .left .skills span{display:block;font-size:12.5px;color:#e8eaed;padding:3px 0}
.cv-modern .right h2{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#111;border-bottom:1px solid #ddd;padding-bottom:4px;margin:14px 0 10px}
.cv-modern .right h2:first-child{margin-top:0}
.cv-modern .entry{margin-bottom:12px}
.cv-modern .entry .h{display:flex;justify-content:space-between;font-weight:600;font-size:13.5px}
.cv-modern .entry .sub{font-size:12.5px;color:#666}
.cv-modern .entry .desc{font-size:13px;margin-top:3px;color:#222;white-space:pre-wrap}
@media(max-width:900px){.cv-modern{grid-template-columns:1fr}.cv-modern .left{margin:-28px -22px 0}}

.cv-minimal{max-width:640px;margin:0 auto}
.cv-minimal h1{font-size:28px;font-weight:400;letter-spacing:.02em;color:#111}
.cv-minimal .job-title{color:#666;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.cv-minimal .contact{font-size:12.5px;color:#666;margin-top:12px;display:flex;gap:12px;flex-wrap:wrap}
.cv-minimal h2{font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:#999;margin:26px 0 10px;font-weight:500}
.cv-minimal .entry{margin-bottom:14px}
.cv-minimal .entry .h{font-weight:600;font-size:13.5px}
.cv-minimal .entry .sub{font-size:12.5px;color:#888}
.cv-minimal .entry .desc{font-size:13px;color:#333;margin-top:3px;white-space:pre-wrap}
.cv-minimal .skills{font-size:13px;color:#333}

/* Table */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;background:var(--bg-2)}
.tbl tr:hover td{background:var(--bg-2)}

/* Empty state */
.empty{padding:44px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.empty .em{font-size:36px;margin-bottom:10px}

/* Loading */
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}

/* Landing sections */
.wow-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:1280px;margin:0 auto}
@media(max-width:800px){.wow-grid{grid-template-columns:1fr}}
.wow{background:var(--bg-1);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.wow .ic{font-size:26px}
.wow h3{font-size:16px}
.wow p{color:var(--muted);font-size:13.5px}

.footer{border-top:1px solid var(--line);padding:32px 24px;color:var(--muted);font-size:13px;text-align:center;margin-top:60px}
.footer a{color:var(--text-2)}
.footer a:hover{color:var(--accent)}

/* File dropzone */
.dropzone{border:2px dashed var(--line-2);border-radius:12px;padding:32px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s;background:var(--bg-1)}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);color:var(--text);background:var(--accent-glow)}
.dropzone .icon{font-size:28px;margin-bottom:8px}

/* Skeleton */
.chip{display:inline-flex;padding:3px 8px;border-radius:5px;background:var(--bg-3);font-size:11px;color:var(--text-2);border:1px solid var(--line)}

/* Split view for CV */
.cv-color-picker{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cv-color-swatch{width:24px;height:24px;border-radius:6px;cursor:pointer;border:2px solid transparent}
.cv-color-swatch.on{border-color:var(--text)}
</style>
</head>

  <a class="brand" href="#/">
    <span class="brand-logo">F</span>
    <span>FCMA</span>
  </a>
  <nav id="nav">
    <a href="#/tools" data-route="tools">Tools</a>
    <a href="#/cv" data-route="cv">CV Studio</a>
    <a href="#/workspace" data-route="workspace">Workspace</a>
    <a href="#/ai" data-route="ai">AI Lab</a>
    <a href="#/builder" data-route="builder">Builder</a>
    <a href="#/privacy" data-route="privacy">Privacy</a>
    <a href="#/donate" data-route="donate" style="color:var(--accent)">❤️ Donate</a>
  </nav>
  <div class="header-spacer"></div>
  <button class="search-trigger" onclick="FL.palette.open()">
    <span>Search tools…</span>
    <kbd>Ctrl</kbd><kbd>K</kbd>
  </button>
  <button class="icon-btn" onclick="FL.theme.toggle()" title="Toggle theme">

  </button>

</header>

<main id="view"></main>

<div class="cp-backdrop" id="cpBackdrop" onclick="if(event.target===this)FL.palette.close()">
